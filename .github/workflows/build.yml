name: Build & Release Cross-Platform Executables

on:
  push:
    branches: [ master, main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
            artifact_name: release_stage_windows
            executable_path: dist/AndroidDeviceManager.exe
            sdk_url: https://dl.google.com/android/repository/platform-tools-latest-windows.zip
          - os: ubuntu-latest
            platform: linux
            artifact_name: release_stage_linux
            executable_path: dist/AndroidDeviceManager
            sdk_url: https://dl.google.com/android/repository/platform-tools-latest-linux.zip

    runs-on: ${{ matrix.os }}

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python 3.13
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'

    - name: Install System Dependencies (Linux)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y libxcb-cursor0 libegl1 libgl1 libglx-mesa0 zip

    - name: Download Platform-Tools from Google
      shell: bash
      run: |
        echo "Downloading Platform-Tools for ${{ matrix.platform }}..."
        mkdir -p bin
        curl -L -o platform-tools.zip ${{ matrix.sdk_url }}

        if [ "${{ matrix.platform }}" = "windows" ]; then
          powershell -Command "Expand-Archive -Path platform-tools.zip -DestinationPath bin -Force"
        else
          unzip -q platform-tools.zip -d bin/
          chmod +x bin/platform-tools/adb bin/platform-tools/fastboot bin/platform-tools/mke2fs
        fi

        rm platform-tools.zip

    - name: Install Python Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyqt6 pyinstaller

    - name: Build Executable with PyInstaller
      run: |
        python -m PyInstaller --clean app.spec

    - name: Stage Release Files
      shell: bash
      run: |
        mkdir -p release_stage/bin

        # Copy binary thực thi
        cp ${{ matrix.executable_path }} release_stage/

        # Copy folder platform-tools vào bundle
        cp -r bin/platform-tools release_stage/bin/

    # Upload folder release_stage thô (chưa zip), GitHub Artifacts sẽ tự handle
    - name: Upload Uncompressed Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.artifact_name }}
        path: release_stage/

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
    - name: Download Windows Folder
      uses: actions/download-artifact@v4
      with:
        name: release_stage_windows
        path: release_stage_windows/

    - name: Download Linux Folder
      uses: actions/download-artifact@v4
      with:
        name: release_stage_linux
        path: release_stage_linux/

    - name: Compress Release ZIPs
      run: |
        mkdir -p final_releases

        # Zip Windows release
        cd release_stage_windows && zip -r ../final_releases/AndroidDeviceManager-Windows-x64.zip . && cd ..

        # Zip Linux release
        cd release_stage_linux && zip -r ../final_releases/AndroidDeviceManager-Linux-x86_64.zip . && cd ..

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        files: |
          final_releases/AndroidDeviceManager-Windows-x64.zip
          final_releases/AndroidDeviceManager-Linux-x86_64.zip
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
